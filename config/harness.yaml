# Task-001: Repository Baseline and V2 Foundation
# config/harness.yaml — main V2 Harness configuration

version: "2.0"

harness:
  name: HADevTeamForFreeModels
  mode: software-engineering

models:
  provider: nous
  cost:
    maximum: 0

execution:
  max_iterations: 3
  require_task_contract: true
  require_verification: true
  require_evidence: true
  require_evaluation: true

autonomy:
  default_level: 2

workspace:
  isolated: true

human_approval:
  required_for:
    - production
    - deployment
    - destructive_operations
    - security_override

# V2.1 — Advanced features
evaluation:
  hard_minimums:
    correctness: 0.90
    security: 0.90
  enabled: true
  # V3.2 Phase 5 — configurable statistical significance thresholds
  # (observed and reported in every statistical evaluation report).
  significance:
    success_rate_pp: 0.05   # min absolute success-rate delta (fraction; 0.05 == 5pp)
    score_delta: 0.01       # min absolute score delta
    min_samples: 10         # deterministic minimum sample size for significance/CI

# V3.2 Phase 6 — reproducible, deterministic exploration configuration.
learning:
  exploration:
    enabled: true           # false => LEARNED_NO_EXPLORATION greedy, no RNG influence
    rate: 0.10              # base exploration rate (bounded by confidence-adaptive rate)
    seed: null              # advisory only; per-decision seed is derived via SHA-256

model_routing:
  adaptive: true
  min_records_for_history: 3

memory:
  persistent: true
  adr_automation: true

registry:
  model_performance: true
  db_path: artifacts/model_performance.db
